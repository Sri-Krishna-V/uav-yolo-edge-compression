# Experimental invariants. Rationale for every value: INVARIANTS.md.
# Changing any value after the first baseline run invalidates every cell measured before it.

shared: # every training run AND every accuracy evaluation
  max_det: 500 # official VisDrone maxDets. Left at 300, Ultralytics silently raises it per context (902 train / 317 val / 461 test-dev)
  iou: 0.7 # NMS IoU, held constant so NMS tuning is never confounded with compression
  conf: 0.001 # Ultralytics val default, made explicit
  nms: null # external NMS on the one-to-many head, for BOTH families: the head every INT8 edge path runs

train: # merged into every training run
  seed: 0
  deterministic: true

eval: # every accuracy evaluation, through scripts/studyeval.py only
  save_json: true # without it the area-split metrics do not exist
  rect: true # what model.val() uses
  batch: 16 # rect batching pads per batch, so batch size moves mAP slightly
  coco_max_dets: [1, 10, 100, 500] # faster-coco-eval defaults to [1, 10, 100] and computes EVERY AP at the last value
